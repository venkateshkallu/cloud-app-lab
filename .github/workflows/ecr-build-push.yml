name: Build, Push and Deploy CloudAppLab

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-1
  ECR_REGISTRY: 764988199649.dkr.ecr.us-west-1.amazonaws.com
  EKS_CLUSTER_NAME: cloudapplab-dev
  K8S_NAMESPACE: cloudapplab

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # 1. Get source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build all four Docker images
      - name: Build images
        run: |
          docker build \
            -t "$ECR_REGISTRY/cloudapplab/frontend:${GITHUB_SHA}" \
            ./cred_fronted

          docker build \
            -t "$ECR_REGISTRY/cloudapplab/cockpit:${GITHUB_SHA}" \
            -f ./cred_deploy/Dockerfile \
            ./cred_deploy

          docker build \
            -t "$ECR_REGISTRY/cloudapplab/pipeline:${GITHUB_SHA}" \
            -f ./cred_deploy/Dockerfile.pipeline \
            ./cred_deploy

          docker build \
            -t "$ECR_REGISTRY/cloudapplab/excel-api:${GITHUB_SHA}" \
            ./cred_fronted/excel-api

      # 5. Install Trivy CLI
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y trivy

      # 6. Scan images
      - name: Trivy scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$ECR_REGISTRY/cloudapplab/frontend:${GITHUB_SHA}"

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$ECR_REGISTRY/cloudapplab/cockpit:${GITHUB_SHA}"

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$ECR_REGISTRY/cloudapplab/pipeline:${GITHUB_SHA}"

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$ECR_REGISTRY/cloudapplab/excel-api:${GITHUB_SHA}"

      # 7. Push images to ECR
      - name: Push images
        run: |
          docker push \
            "$ECR_REGISTRY/cloudapplab/frontend:${GITHUB_SHA}"

          docker push \
            "$ECR_REGISTRY/cloudapplab/cockpit:${GITHUB_SHA}"

          docker push \
            "$ECR_REGISTRY/cloudapplab/pipeline:${GITHUB_SHA}"

          docker push \
            "$ECR_REGISTRY/cloudapplab/excel-api:${GITHUB_SHA}"

      # 8. Install kubectl
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      # 9. Configure kubectl for EKS
      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # 10. Verify EKS connection
      - name: Verify EKS
        run: |
          kubectl cluster-info
          kubectl get nodes

      # 11. Create namespace
      - name: Create namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      # 12. Deploy Kubernetes manifests
      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/cockpit/
          kubectl apply -f k8s/pipeline/
          kubectl apply -f k8s/excel-api/
          kubectl apply -f k8s/frontend/

      # 13. Update deployments with immutable Git SHA images
      - name: Update container images
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/cockpit \
            cockpit="$ECR_REGISTRY/cloudapplab/cockpit:${GITHUB_SHA}"

          kubectl -n "$K8S_NAMESPACE" set image deployment/pipeline \
            pipeline="$ECR_REGISTRY/cloudapplab/pipeline:${GITHUB_SHA}"

          kubectl -n "$K8S_NAMESPACE" set image deployment/excel-api \
            excel-api="$ECR_REGISTRY/cloudapplab/excel-api:${GITHUB_SHA}"

          kubectl -n "$K8S_NAMESPACE" set image deployment/frontend \
            frontend="$ECR_REGISTRY/cloudapplab/frontend:${GITHUB_SHA}"

      # 14. Wait for rollout
      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/cockpit --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/pipeline --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/excel-api --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/frontend --timeout=180s

      # 15. Verify deployment
      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n "$K8S_NAMESPACE"

          echo "=== Services ==="
          kubectl get services -n "$K8S_NAMESPACE"

          echo "=== Deployments ==="
          kubectl get deployments -n "$K8S_NAMESPACE"